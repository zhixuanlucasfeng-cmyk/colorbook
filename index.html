<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="像素填色">
<meta name="theme-color" content="#171715">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=6">
<title>像素填色</title>
</head>
<body>
<main id="home">
  <header class="masthead"><div><h1>像素填色<span aria-hidden="true">!</span></h1><p>把照片，一格格变成作品。</p></div><div class="head-note">自己的照片<br>自己的颜色</div></header>
  <section class="collection" aria-labelledby="collectionTitle">
    <div class="section-head"><h2 id="collectionTitle">我的作品</h2><span id="artCount">00</span></div>
    <div id="gallery"></div>
  </section>
  <details class="settings"><summary>新作品设置 <span id="settingsSummary">320 格 · 32 色</span></summary>
    <div class="new">
      <label>颜色数量 <input id="colors" type="range" min="8" max="64" value="32"> <b id="colorsOut">32</b></label>
      <label>长边格数 <select id="detail"><option value="120">120</option><option value="200">200</option><option value="320" selected>320</option><option value="480">480</option><option value="640">640</option><option value="800">800（超细）</option></select></label>
      <label class="wb"><input id="wb" type="checkbox" checked> 自动白平衡</label>
      <p class="setting-hint">格数越多，细节越丰富；颜色越多，渐变越细腻。</p>
    </div>
  </details>
  <div class="import-dock"><button id="import" class="primary"><img src="mp/assets/plus-paper.svg" alt="">导入照片</button><input id="file" type="file" accept="image/*" hidden><p id="status" role="status"></p><p class="promise">本机处理 · 离线可用 · 没有广告</p></div>
</main>
<section id="play" hidden aria-label="涂色工作台">
  <div class="play-header"><button id="back"><span aria-hidden="true">‹</span> 返回作品集</button><span id="saveState" role="status">已保存</span></div>
  <div class="progress-row"><progress id="progressBar" max="100" value="0" aria-label="填色进度"></progress><span id="progress"></span></div>
  <div id="stage"><canvas aria-label="数字填色画布：单指或画笔涂色，双指移动和缩放"></canvas></div>
  <div id="tools">
    <div class="tool-buttons"><button data-tool="brush" class="on" aria-pressed="true"><img src="mp/assets/brush-ink.svg" alt="">画笔</button><button data-tool="bucket" aria-pressed="false"><img src="mp/assets/bucket-ink.svg" alt="">油漆桶</button><label class="btn" id="recolor"><img src="mp/assets/palette-ink.svg" alt="">改色<input id="pick" type="color" aria-label="修改当前颜色"></label></div>
    <label id="sizeBox">粗细 <input id="size" type="range" min="1" max="25" value="1"><span><b id="sizeOut">1</b> 格</span></label>
  </div>
  <div class="palette-heading"><strong id="selectedInfo"></strong><span>双指移动与缩放</span></div>
  <div id="palette" aria-label="选择填色编号"></div>
  <div id="done" role="status" hidden><strong>这一幅，完成！</strong><span>每一格，都是你的颜色。</span></div>
</section>
<script type="module" src="app.js?v=6"></script>
</body>
</html>
